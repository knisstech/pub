<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruins of Stone</title>
<link rel="icon" href="/pub/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Big+Shoulders+Stencil+Display:wght@800&display=swap">
<style>
:root { color-scheme: dark; --night: #0b0e14; --moon: #e3e7ee; --concrete: #9aa3b3; --sodium: #ffa646; --sodium-ink: #1a1006; }
body {
  margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 18px; text-align: center;
  background: var(--night); color: var(--moon);
  font: 1.0625rem/1.6 "Barlow", "Segoe UI", system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { margin: 0; font: 800 clamp(3rem, 12vw, 6rem)/0.9 "Big Shoulders Stencil Display", Impact, sans-serif; text-transform: uppercase; }
p { margin: 0; color: var(--concrete); }
a { justify-self: center; padding: 12px 22px; background: var(--sodium); color: var(--sodium-ink); font-weight: 500; text-decoration: none; border-radius: 3px; }
a:focus-visible { outline: 2px solid var(--sodium); outline-offset: 3px; }
</style>
</head>
<body>
  <h1>Lost in the ruins</h1>
  <p>This page doesn't exist. / Esta página não existe.</p>
  <a href="/pub/">Ruins of Stone</a>
</body>
</html>
